name: 构建末世废土 APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'index.html'
      - 'android/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    name: 编译 APK
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Android SDK
        run: |
          set -e
          export ANDROID_HOME=/usr/local/lib/android/sdk
          sudo mkdir -p "$ANDROID_HOME"
          sudo chown -R "$USER" "$ANDROID_HOME"
          if [ ! -f "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "downloading cmdline-tools ..."
            curl -sSL -o /tmp/cmdtools.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            mkdir -p /tmp/cmdt "$ANDROID_HOME/cmdline-tools/latest"
            unzip -q -o /tmp/cmdtools.zip -d /tmp/cmdt
            cp -r /tmp/cmdt/cmdline-tools/. "$ANDROID_HOME/cmdline-tools/latest/"
          fi
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          sdkmanager --list_installed
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: 同步网页资源到 assets
        run: |
          mkdir -p android/app/src/main/assets/src
          cp index.html android/app/src/main/assets/index.html
          rsync -a --delete src/ android/app/src/main/assets/src/

      - name: 安装 Gradle 8.5
        run: |
          curl -sL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.5/bin" >> "$GITHUB_PATH"

      - name: 编译
        run: |
          gradle -p android assembleRelease assembleDebug --no-daemon

      - name: 列出产物
        run: find android/app/build/outputs/apk -name '*.apk'

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: 末世废土-APK
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
